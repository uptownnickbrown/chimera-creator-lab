[project]
name = "chimera-backend"
version = "0.1.0"
description = "Chimera Creator — creature fusion game backend (FastAPI + SQLAlchemy 2 async)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",           # dev/test driver
    "asyncpg>=0.30",             # prod driver (Railway Postgres)
    "alembic>=1.14",
    "pydantic>=2.9",
    "httpx>=0.27",
    "openai>=1.60",              # gpt-5.1 records + gpt-image-1.5 heroes (services/, stubbed today)
    "google-genai>=0.8",         # gemini fallbacks + pregen asset pipeline
    "pillow>=10.4",              # thumbnail crops / alpha compositing
    "python-multipart>=0.0.12",  # multipart uploads (asset ingest)
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.7"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008 is the FastAPI dependency-injection idiom (`= Depends(...)`), not a bug.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
