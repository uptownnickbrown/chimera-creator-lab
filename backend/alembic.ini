[alembic]
script_location = alembic
prepend_sys_path = .
# The URL comes from DATABASE_URL at runtime (alembic/env.py); this is only a
# harmless default so `alembic` runs without env vars in a dev shell.
sqlalchemy.url = sqlite+aiosqlite:///./chimera.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
