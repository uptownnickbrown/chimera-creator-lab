name: CI

# Deploys are Railway-native (GitHub integration: push to main -> build ->
# deploy), so there is deliberately no deploy job and no Railway token here.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # No virtualenv: the runner's Python is already disposable.
      - name: Install backend
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      # The prod schema comes from alembic, the dev schema from create_all.
      # This proves they still agree — a model change without a migration is a
      # broken Postgres deploy, and this is where we want to find that out.
      - name: Alembic migrations match models
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci-migration-check.db
        run: |
          alembic upgrade head
          alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
